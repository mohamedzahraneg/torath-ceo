  +it.map(function(x,i){var c=cov(x);return '<tr><td class="b st pin"><span class="pn2"><span class="rk num">'+(i+1)+'</span>'+esc(x.n)+'</span></td><td class="e b">'+ns(x.avail)+(x.dmg?'<span class="m"> + '+n(x.dmg)+' تالف</span>':'')+'</td><td><span style="display:inline-flex;align-items:center;gap:6px;white-space:nowrap"><span class="dm" style="color:'+tone(c,x.avail)+'"></span>'+(x.avail<=0?'<b>خلص</b>':c===null?'<span class="m">مفيش سحب</span>':'<b class="num">'+Math.floor(c)+'</b> يوم')+'</span></td><td class="e b">'+ns(x.avail*x.p)+'</td><td>'+shbar(sd(Math.max(0,x.avail*x.p),T.vAvail))+'</td><td class="e">'+n(x.p)+'</td><td class="e">'+n(x.open)+'</td><td class="e'+(x.in?'':' m')+'" title="'+esc(I.rc.map(function(d,j){return dlab(d)+': '+(x.rcv[j]||0)}).join(' · '))+'">'+n(x.in)+'</td><td class="e'+(x.back?'':' m')+'">'+n(x.back)+'</td><td class="e">'+n(x.del)+'</td><td class="e'+(x.res+(x.resF||0)?'':' m')+'">'+n(x.res+(x.resF||0))+'</td></tr>'}).join('')
  +'<tr class="tot"><td class="st pin">الإجمالي</td><td class="e">'+ns(T.avail)+'</td><td></td><td class="e">'+ns(T.vAvail)+'</td><td>'+pc(1)+'</td><td></td><td class="e">'+n(T.open)+'</td><td class="e">'+n(T.rcv)+'</td><td class="e">'+n(T.back)+'</td><td class="e">'+n(T.del)+'</td><td class="e">'+n(T.res+(T.resF||0))+'</td></tr></tbody></table></div>';
 h+='<p class="pgs" style="font-size:13px;margin:0">الوارد: '+I.rc.map(function(d){return dlab(d)+' '+n(it.reduce(function(a,x){return a+(x.rcv[I.rc.indexOf(d)]||0)},0))+' قطعة'}).join('، ')+'. المسحوب = كل الطلبات اللي خرجت من المخزن من '+dlab(I.start)+'، مع شركة الشحن أو مندوب المصنع: اتسلّمت = مسحوب، لسه مع شركة الشحن أو المندوب = محجوز، ورجعت = رجعت المخزن. طلبات خرجت قبل '+dlab(I.start)+' مش محسوبة لأنها مش في جرد أول الشهر. «يكفي» = المتاح ÷ متوسط التسليم في اليوم من أول الشهر ('+n(dn)+' يوم). الأرقام بتتعدّل من تاب «المخزن» في شيت الطلبات.</p></section>';

function render(p){return p==='fin'?fin(row(D.fin,M)):p==='day'?day():p==='prod'?prodSec():p==='inv'?invSec():bd(row(D.bd,M))}

function draw(){fill();var o=document.getElementById('out');o.innerHTML=render(P)+foot();cardify(o);tint(o);document.getElementById('up').innerHTML='لايف · اتحدّث '+'<span class="num">'+esc(D.at)+'</span>';
 Array.prototype.forEach.call(document.querySelectorAll('#out .seg button'),function(b){b.onclick=function(){PM=b.getAttribute('data-m');draw()}})}
document.getElementById('m').onchange=function(){M=this.value;draw()};
Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'),function(t){t.onclick=function(){P=t.getAttribute('data-p');Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'),function(x){if(x===t)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});if(D)draw()}});

document.getElementById('pdf').onclick=function(){if(!D)return;document.getElementById('dlgp').textContent=NAMES[P]+'، بنفس الأرقام اللي قدامك';document.getElementById('dm').value=M;if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','')};

function summary(){var r=row(D.fin,M),b=row(D.bd,M),C=D.cash||{};if(!r)return '';var nx=(C.next||[])[0],ls=(C.deps||[])[0],L=[];
 L.push(['var(--teal)','المتبقي من الـ20% <b>'+ns(r[18])+'</b> ج'+(Number(r[18])<0?' (عجز)':'، يعني '+pc(sd(r[18],r[3]))+' من المبيعات ربح صافي')+'، بعد مصاريف '+n(r[17])+' ج ('+pc(sd(r[17],r[4]))+' من الـ20%).']);
 L.push(['var(--primary)','المبيعات <b>'+n(r[3])+'</b> ج من '+n(r[2])+' طلب اتسلّم. ومن '+n(r[19])+' طلب اتعمل في الشهر، اتسلّم '+pc(r[24])+'.']);
 var sr=Number(r[7])||0;L.push(['var(--amber)','التوريدات <b>'+n(r[6])+'</b> ج'+(sr<0?'، أكتر من الصافي بـ'+n(-sr)+' ج، فده مستحق له.':sr>0?'، ولسه عليه يورّد '+n(sr)+' ج.':'، قد الصافي بالظبط.')]);
 if(ls||nx)L.push(['var(--indigo)',(ls?'آخر توريد من شركة الشحن <b>'+n(ls[1])+'</b> ج يوم '+dlab(ls[0])+'.':'')+(nx?' والتوريد الجاي '+n(nx[1])+' ج يوم '+dlab(nx[0])+'.':'')]);
 return '<h2 style="margin-bottom:8px">الخلاصة</h2><ul class="rsum">'+L.map(function(x){return '<li><span class="dm" style="color:'+x[0]+'"></span><span>'+x[1]+'</span></li>'}).join('')+'</ul>'}

 secs.forEach(function(s,i){h+='<section class="rs">'+(i===0?'<div class="rcov"><div class="b"><span class="dm"></span>تراث</div><h1>'+(kind==='page'?'تقرير '+NAMES[s]:'تقرير الحسابات')+'</h1><p>'+ml+' · البيانات لحد <span class="num">'+at+'</span></p></div>'+(kind==='all'?summary():''):rhead(NAMES[s]))+'<main>'+render(s)+'</main><div class="rft"><span>اتعمل من صفحة حسابات تراث · <span class="num">'+at+'</span></span><span>'+NAMES[s]+'</span></div></section>'});

 if(!secs.length){e.preventDefault();return}var keepM=M;M=document.getElementById('dm').value;
